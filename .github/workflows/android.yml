name: App Android

# O app Android (app/mobile, docs/APPS.md) compila-se aqui; não é preciso o Android Studio.
#
# - Em cada PR que mexa no app: build de verificação (APK de debug, sem assinatura de envio), que
#   fica nos artefactos da corrida para instalar num telemóvel e experimentar.
# - «Run workflow» (à mão) ou uma etiqueta android-v*: o AAB assinado com a chave de envio, nos
#   artefactos da corrida e, com a conta de serviço da Play Console, na faixa de testes internos
#   (como rascunho). O primeiro AAB de sempre carrega-se à mão na Play Console.
#   Sai também o APK assinado com a mesma chave, publicado numa Release do GitHub: é o ficheiro
#   que a página /app do site dá a descarregar (Configurações → PWA / telemóvel): o deploy do site
#   copia-o para https://livrariaadventista.ao/downloads/livraria-adventista.apk.
#   A chave de envio vem dos segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD ou, sem eles, do Vault do Supabase (passo «Chave de
#   envio»), onde se gera sozinha na primeira corrida. Opcionais: GOOGLE_SERVICES_JSON
#   (notificações) e PLAY_SERVICE_ACCOUNT_JSON (envio para a Play Store).
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  push:
    tags: ['android-v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Build de verificação (APK)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci --no-audit --no-fund

      # Copia o www/ e o capacitor.config.json para dentro do projecto Android (estão no
      # .gitignore) e liga os plugins.
      - name: Capacitor sync
        working-directory: app/mobile
        run: npx cap sync android

      # O APK de debug é o que se instala para experimentar. O AAB de release sai sem assinatura
      # (não há chave de envio num PR) e deita-se fora: serve para o caminho do envio para a Play
      # Store (bundleRelease e a verificação lintVital) falhar aqui, e não no dia de publicar.
      - name: Build (APK de debug e AAB de release sem assinatura)
        working-directory: app/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      # O APK fica nos artefactos da corrida: descarrega-se e instala-se num telemóvel Android
      # para experimentar o app antes de haver chave de envio ou Play Console (docs/APPS.md).
      # É um build de debug, sem o Firebase: não recebe notificações e não serve para a loja.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livraria-adventista-android-debug
          path: app/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  play:
    name: Enviar para a Play Store
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A chave de envio (a «assinatura» do app) fica só no disco temporário desta máquina. Vem:
      # - dos segredos ANDROID_KEYSTORE_* do GitHub, quando existem;
      # - senão, do Vault do Supabase (segredo «android_signing»), lido com o SUPABASE_ACCESS_TOKEN
      #   que o deploy do Supabase já usa. Na primeira vez que não existe em lado nenhum, gera-se
      #   aqui e guarda-se lá: nunca passa por uma pessoa nem fica nos registos. É SEMPRE a mesma
      #   chave depois disso — com outra, quem instalou o APK do site não consegue actualizar.
      # Corre antes do `npm ci`: o token do Supabase só existe neste passo, antes de qualquer
      # código de terceiros correr na máquina.
      - name: Chave de envio
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          chave="$RUNNER_TEMP/envio.jks"
          umask 077
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              [ -n "${!name}" ] || { echo "::error::Falta o segredo $name (ver docs/APPS.md)"; exit 1; }
            done
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$chave"
            senha="$ANDROID_KEYSTORE_PASSWORD"; nome="$ANDROID_KEY_ALIAS"; senha_da_chave="$ANDROID_KEY_PASSWORD"
            origem="segredos do GitHub"
          else
            if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
              echo "::error::Sem chave de envio: faltam os segredos ANDROID_KEYSTORE_* ou o SUPABASE_ACCESS_TOKEN e a variável SUPABASE_PROJECT_REF (ver docs/APPS.md)"
              exit 1
            fi
            sql() {
              jq -n --arg q "$1" '{query: $q}' | curl -fsS -X POST \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
                --data-binary @-
            }
            # Uma leitura que falha pára aqui (curl -f): nunca se gera uma chave nova por engano.
            guardada="$(sql "select decrypted_secret as v from vault.decrypted_secrets where name = 'android_signing'" | jq -r '.[0].v // empty')"
            if [ -n "$guardada" ]; then
              echo "::add-mask::$guardada"
              senha="$(jq -r .password <<<"$guardada")"
              echo "::add-mask::$senha"
              nome="$(jq -r .alias <<<"$guardada")"
              jq -r .keystore <<<"$guardada" | base64 --decode > "$chave"
              origem="Vault do Supabase"
            else
              senha="$(openssl rand -hex 24)"
              echo "::add-mask::$senha"
              nome="livraria"
              keytool -genkeypair -keystore "$chave" -storetype PKCS12 -alias "$nome" \
                -keyalg RSA -keysize 4096 -validity 10000 \
                -dname "CN=Livraria Adventista, O=Livraria Adventista, L=Luanda, C=AO" \
                -storepass "$senha" -keypass "$senha" >/dev/null 2>&1
              valor="$(jq -cn --arg k "$(base64 -w0 "$chave")" --arg s "$senha" --arg a "$nome" '{keystore: $k, password: $s, alias: $a}')"
              echo "::add-mask::$valor"
              # base64, hexadecimal e o nome: nenhum tem plicas, mas confirma-se antes de ir no SQL.
              case "$valor" in *"'"*) echo "::error::Valor inesperado na chave gerada"; exit 1 ;; esac
              # O nome é único no Vault: se outra corrida a guardou ao mesmo tempo, esta falha e a
              # seguinte usa a que ficou.
              sql "select vault.create_secret('$valor', 'android_signing', 'Chave de assinatura do app Android (.github/workflows/android.yml). NÃO APAGAR: sem ela quem instalou o APK do site não actualiza a app.')" >/dev/null
              origem="gerada agora e guardada no Vault do Supabase (android_signing)"
            fi
            senha_da_chave="$senha"
          fi
          impressao="$(keytool -list -v -keystore "$chave" -storepass "$senha" -alias "$nome" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')"
          [ -n "$impressao" ] || { echo "::error::A chave de envio não abre com a senha guardada"; exit 1; }
          {
            echo "ANDROID_KEYSTORE_PATH=$chave"
            echo "ANDROID_KEYSTORE_PASSWORD=$senha"
            echo "ANDROID_KEY_ALIAS=$nome"
            echo "ANDROID_KEY_PASSWORD=$senha_da_chave"
          } >> "$GITHUB_ENV"
          {
            echo "Chave de envio: $origem."
            echo ""
            echo "Impressão SHA-256 do certificado (pública; é a da variável ANDROID_CERT_SHA256):"
            echo ""
            echo "    $impressao"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci --no-audit --no-fund

      # As notificações do Android vêm pelo Firebase: sem este ficheiro o app funciona, mas não
      # pede notificações (o site pergunta ao app antes, lib/pushNotifications.js).
      - name: Firebase (notificações)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/mobile/android/app/google-services.json
            echo "Firebase: ligado."
          else
            echo "::warning::Sem GOOGLE_SERVICES_JSON: este build não recebe notificações."
          fi

      - name: Capacitor sync
        working-directory: app/mobile
        run: npx cap sync android

      # A chave e as senhas vêm do passo «Chave de envio» (ANDROID_KEYSTORE_PATH e companhia).
      - name: AAB assinado
        working-directory: app/mobile/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          # A versão vem do app/mobile/package.json; o número, desta corrida (a Play Store exige um
          # número novo em cada envio).
          export ANDROID_VERSION_NAME="$(node -p "require('../package.json').version")"
          chmod +x gradlew
          # O AAB vai para a Play Store; o APK, com a mesma chave, é o que se descarrega do site.
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/livraria-adventista.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livraria-adventista-android
          path: app/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livraria-adventista-android-apk
          path: ${{ runner.temp }}/livraria-adventista.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enviar para os testes internos da Play Store
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Sem PLAY_SERVICE_ACCOUNT_JSON: o AAB fica nos artefactos desta corrida, para carregar à mão." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          chmod 600 "$RUNNER_TEMP/play.json"
          sudo gem install fastlane --no-document
          fastlane supply \
            --package_name ao.livrariaadventista.app \
            --aab app/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            --track internal \
            --release_status draft \
            --json_key "$RUNNER_TEMP/play.json" \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true
          echo "Build ${{ github.run_number }} enviado para os testes internos (rascunho) da Play Store." >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar as chaves
        if: always()
        run: rm -f "$RUNNER_TEMP/envio.jks" "$RUNNER_TEMP/play.json" app/mobile/android/app/google-services.json

  # O APK assinado fica numa Release do GitHub e, a seguir, o site é publicado outra vez: o
  # deploy (deploy-cloudflare.yml) copia o APK da Release mais recente para
  #   https://livrariaadventista.ao/downloads/livraria-adventista.apk
  # o endereço a pôr em Configurações → PWA / telemóvel → Android, para a página /app. Os
  # ficheiros de uma Release de um repositório privado (como este) não se descarregam sem sessão
  # no GitHub; servidos pelo site, sim. À parte do job de cima: só este escreve no repositório,
  # e não vê nenhum segredo.
  apk:
    name: Publicar o APK para descarregar
    needs: play
    # O APK já está nos artefactos quando o envio para a Play Store corre: uma falha lá (o
    # primeiro AAB carrega-se à mão, por exemplo) não impede de o publicar aqui.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Para lançar o deploy do site, que passa a servir o APK novo.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: livraria-adventista-android-apk
          path: ${{ runner.temp }}/apk

      - name: Release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./app/mobile/package.json').version")"
          # Com uma etiqueta android-v*, a Release é a dela; à mão, cria-se uma para esta corrida.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="android-v${version}-b${{ github.run_number }}"
          fi
          apk="$RUNNER_TEMP/apk/livraria-adventista.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "App Android ${version} (build ${{ github.run_number }})" \
              --notes "A app da Livraria Adventista para Android. Descarregue o ficheiro livraria-adventista.apk no telemóvel e abra-o para instalar; uma versão nova instala-se por cima."
          fi
          {
            echo "APK publicado em **${tag}**."
            echo ""
            echo "O site é publicado outra vez e passa a servi-lo em (Configurações → PWA / telemóvel → Android):"
            echo ""
            echo "    https://livrariaadventista.ao/downloads/livraria-adventista.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      # O deploy do site copia o APK desta Release para /downloads/ (deploy-cloudflare.yml).
      - name: Publicar o site com o APK novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main
