name: Verificação (PR)

# Corre em cada pull request para o main: apanha erros antes do merge e do deploy.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint e build do site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Antes de tudo: uma credencial no PR tem de ser revogada, e quanto mais cedo melhor.
      - name: Segredos nos ficheiros versionados
        run: node scripts/verificar-segredos.mjs

      - name: Lint
        run: npm run lint

      # Sem variáveis de ambiente de propósito: os valores do Supabase para os testes estão
      # fixos no `test.env` do app/web/vitest.config.js. Os testes são unitários e não tocam a
      # rede, por isso não dependem de segredos nem do app/web/.env, que é gitignored e não
      # existe num checkout.
      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Dependências do site com vulnerabilidade crítica conhecida param o PR. Só "critical":
      # as 4 "high" de hoje são do gRPC, que o Firebase usa no servidor e não entra no bundle
      # (ver docs/AUDITORIA.md), e um gate que fica sempre vermelho deixa de ser lido.
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=critical

  # O fluxo de compra num navegador a sério: catálogo → carrinho → dados e pagamento → sucesso →
  # rastreio → confirmação de recepção, em computador e em telemóvel. O site é o build de
  # produção; o Supabase é falso e responde na rede (app/web/e2e/lojaFalsa.js), por isso não há
  # segredos nem se toca na base de dados. Apanha o que os testes unitários não vêem: peças
  # certas sozinhas e mal ligadas (ver app/web/e2e/README.md).
  e2e:
    name: Fluxo de compra (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Só o Chromium (e as bibliotecas do sistema de que precisa): os dois projectos do
      # playwright.config.js, computador e telemóvel, correm nele.
      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium
        working-directory: app/web

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      # Só quando falha: o relatório traz a captura do ecrã e o traço da tentativa repetida.
      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/web/playwright-report/
            app/web/test-results/
          retention-days: 7

  edge-function:
    name: Verificar Edge Function "app"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2 (v2.0.5)
        with:
          deno-version: v2.x

      - name: deno check
        working-directory: supabase/functions/app
        run: deno check --node-modules-dir=auto index.ts

  # Os cenários das regras da base de dados (pagamentos, entregas, permissões…), com as migrações
  # reais em PGlite. Apanham o que o site e a Edge Function não vêem: uma migração de um PR que
  # desfaz a regra de outro, um gatilho que falha para quem usa o site, uma tabela sem RLS.
  # Instruções em scripts/pglite/base.mjs.
  cenarios:
    name: Cenários da base de dados
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Instalar o PGlite
        run: npm install --prefix "$RUNNER_TEMP/pglite" --no-audit --no-fund @electric-sql/pglite@0.2.17

      - name: Correr os cenários
        run: |
          export PGLITE_MODULE="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite/dist/index.js"
          falhou=""
          for f in scripts/pglite/*.mjs; do
            nome=$(basename "$f" .mjs)
            [ "$nome" = base ] && continue
            echo "::group::$nome"
            node "$f" supabase/migrations || falhou="$falhou $nome"
            echo "::endgroup::"
          done
          if [ -n "$falhou" ]; then
            echo "::error::Cenários com falhas:$falhou"
            exit 1
          fi

  # Uma migração com erro só aparecia no merge, ao ser aplicada em produção pelo
  # deploy-supabase.yml. Aqui todas as migrações são aplicadas do zero num Postgres local,
  # antes do merge: se uma falhar, o PR fica vermelho e produção não é tocada.
  migracoes:
    name: Migrações aplicam do zero
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A mesma versão do CLI que publica em produção (deploy-supabase.yml): com `latest`, o CI
      # podia validar as migrações com um CLI diferente do que as aplica.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1 (v1.7.3)
        with:
          version: 2.121.0

      - name: Postgres local com todas as migrações
        run: supabase db start
