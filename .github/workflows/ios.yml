name: App iOS

# O app iOS (app/ios, docs/APP_IOS.md) compila-se aqui, num Mac do GitHub: não é preciso ter um.
#
# - Em cada PR que mexa no app (ou no que ele carrega do site): build para o simulador, sem
#   assinatura. Confirma que o projecto compila antes de haver segredos da Apple.
# - "Run workflow" (à mão) ou uma etiqueta ios-v*: arquivo assinado e envio para o TestFlight.
#   Precisa dos segredos APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID e
#   APP_STORE_CONNECT_KEY_P8 (o .p8 em base64) e da variável APPLE_TEAM_ID.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/ios/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  push:
    tags: ['ios-v*']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulador:
    name: Build para o simulador
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Copia o www/ e o capacitor.config.json para dentro do projecto Xcode (estão no .gitignore)
      # e actualiza o Package.swift com os plugins.
      - name: Capacitor sync
        working-directory: app/ios
        run: npx cap sync ios

      - name: Xcode
        run: xcodebuild -version

      - name: Build (simulador, sem assinatura)
        working-directory: app/ios/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Enviar para o TestFlight
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Confirmar segredos e variáveis
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam em Settings → Secrets and variables → Actions:$missing (ver docs/APP_IOS.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Capacitor sync
        working-directory: app/ios
        run: npx cap sync ios

      - name: Xcode
        run: xcodebuild -version

      # A chave da App Store Connect assina na nuvem da Apple (certificado e perfil geridos pelo
      # Xcode) e envia o build. Fica só no disco temporário desta máquina.
      - name: Chave da App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Arquivo assinado
        working-directory: app/ios/ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          # A versão vem do app/ios/package.json; o número do build, desta corrida (cada envio ao
          # TestFlight tem de ter um número novo).
          version="$(node -p "require('../../package.json').version")"
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Enviar para a App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Build ${{ github.run_number }} enviado. Aparece no TestFlight depois de a Apple o processar (10 a 30 minutos)." >> "$GITHUB_STEP_SUMMARY"

      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
