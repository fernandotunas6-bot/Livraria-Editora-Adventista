name: KanGest Livraria

# A edição do KanGest só da livraria (app/kangest-sistema/, separada do KanGest oficial desde a 1.4.4 —
# docs/KANGEST.md). Os workflows dentro de app/kangest-sistema/.github/ são os do oficial e não correm aqui.
#
# - verificar: em cada PR e push ao main que mexa na edição — tipos, CSS para o WebKit antigo, clippy e testes
#   (numa compilação de desenvolvimento e numa com uma chave de produtor de teste, o caminho da versão certificada).
#   É o compilador da edição: no computador de desenvolvimento não há espaço para o target do Rust.
# - instalador: só à mão (Actions → KanGest Livraria → Run workflow, «instalador»). Gera o .exe do Windows com os
#   segredos da AGT, da Facturação Electrónica e do selo, se existirem neste repositório; sem eles, o instalador
#   assina com a chave de desenvolvimento e não vale para a AGT (o KanGest oficial 1.4.4 também ainda não os tem).
# - publicar: à mão e só a partir do main («publicar no site»). Assina o instalador para as actualizações (minisign,
#   segredos KANGEST_LIVRARIA_ACTUALIZACOES_PRIVADA e _SENHA; a pública, a variável
#   KANGEST_LIVRARIA_CHAVE_ACTUALIZACOES, vai embutida no programa), escreve o manifesto kangest-atualizacao.json,
#   guarda tudo numa Release «kangest-livraria-v…» e publica o site outra vez. O deploy do site
#   (deploy-cloudflare.yml) copia-os para https://livrariaadventista.ao/kangest/actualizacoes/: é de lá que o painel
#   o dá a descarregar (Sistema → Ligação ao KanGest) e que o programa vai buscar as versões novas.
on:
  pull_request:
    paths:
      - "app/kangest-sistema/**"
      - ".github/workflows/kangest-livraria.yml"
  push:
    branches: [main]
    paths:
      - "app/kangest-sistema/**"
      - ".github/workflows/kangest-livraria.yml"
  workflow_dispatch:
    inputs:
      instalador:
        description: "Gerar também o instalador do Windows"
        type: boolean
        default: false
      publicar:
        description: "Publicar o instalador no site, para descarregar e para as actualizações (só no main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kangest-livraria-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app/kangest-sistema

jobs:
  verificar:
    name: Verificar a edição
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/kangest-sistema/package-lock.json

      - name: Rust (stable, com clippy)
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/kangest-sistema/src-tauri -> target

      - name: Dependências do sistema (WebKitGTK do Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev

      - run: npm ci

      - name: Tipos do frontend
        run: npm run typecheck

      # o CSS compilado tem de funcionar no WebKit do macOS 12 e anteriores (docs/BUILD.md da edição)
      - name: CSS para o WebKit do macOS 12
        run: |
          npx vite build
          node scripts/verificar-css.mjs
          # KANGEST ONE, teste de aceitação 13: o ecrã compilado não leva nenhuma credencial privilegiada
          node ../../scripts/verificar-segredos.mjs --pasta dist

      - name: Clippy
        working-directory: app/kangest-sistema/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Testes (desenvolvimento)
        working-directory: app/kangest-sistema/src-tauri
        run: cargo test --locked

      - name: Testes (com chave do produtor embutida)
        working-directory: app/kangest-sistema/src-tauri
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:1024 -out "$RUNNER_TEMP/produtor-teste.pem"
          KANGEST_AGT_CHAVE_FICHEIRO="$RUNNER_TEMP/produtor-teste.pem" KANGEST_AGT_CERTIFICADO=999 cargo test --locked

  # Os instaladores: o do Windows (NSIS .exe) e os do Mac (.dmg), para os Mac com Apple Silicon (M1, M2…) e para os
  # Mac com Intel, a partir do macOS 10.15 (tauri.conf.json, bundle.macOS.minimumSystemVersion). O GitHub já não tem
  # runners Mac com Intel: compila-se de forma cruzada no Apple Silicon, como no KanGest oficial (build.yml).
  instalador:
    name: Instalador (${{ matrix.nome }})
    if: github.event_name == 'workflow_dispatch' && (inputs.instalador || inputs.publicar)
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: windows
            plataforma: windows-latest
            alvo: ""
            args: "--bundles nsis"
            ficheiros: app/kangest-sistema/src-tauri/target/release/bundle/nsis/*.exe
          - nome: mac-apple-silicon
            plataforma: macos-latest
            alvo: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            ficheiros: app/kangest-sistema/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - nome: mac-intel
            plataforma: macos-latest
            alvo: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            ficheiros: app/kangest-sistema/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.plataforma }}
    outputs:
      agt: ${{ steps.agt.outputs.agt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/kangest-sistema/package-lock.json

      - name: Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "${{ matrix.alvo }}" ]; then rustup target add "${{ matrix.alvo }}"; fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/kangest-sistema/src-tauri -> target
          key: ${{ matrix.nome }}

      - run: npm ci

      # Sem certificado da Apple: assinatura «ad-hoc» (evita o aviso «danificado» nos Mac com Apple Silicon; na primeira
      # vez abre-se com o botão direito → Abrir, docs/INSTALACAO.md).
      - name: Assinatura ad-hoc (Mac)
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      # no shell de cada sistema (no Windows, o PowerShell: o OpenSSL não se compila com o Perl do Git Bash)
      - name: Compilar
        env:
          KANGEST_AGT_CHAVE: ${{ secrets.KANGEST_AGT_CHAVE }}
          KANGEST_AGT_CERTIFICADO: ${{ secrets.KANGEST_AGT_CERTIFICADO }}
          KANGEST_AGT_VERSAO_CHAVE: ${{ secrets.KANGEST_AGT_VERSAO_CHAVE }}
          KANGEST_FE_UTILIZADOR: ${{ secrets.KANGEST_FE_UTILIZADOR }}
          KANGEST_FE_SENHA: ${{ secrets.KANGEST_FE_SENHA }}
          KANGEST_FE_CHAVE_SOFTWARE: ${{ secrets.KANGEST_FE_CHAVE_SOFTWARE }}
          KANGEST_FE_NUMERO_VALIDACAO: ${{ secrets.KANGEST_FE_NUMERO_VALIDACAO }}
          # a chave das actualizações é a da edição, nunca a do KanGest oficial
          KANGEST_CHAVE_ACTUALIZACOES: ${{ vars.KANGEST_LIVRARIA_CHAVE_ACTUALIZACOES }}
          KANGEST_EXIGIR_CERTIFICACAO: ${{ vars.KANGEST_EXIGIR_CERTIFICACAO }}
          KANGEST_SELO_PUBLICA: ${{ secrets.KANGEST_SELO_PUBLICA }}
          KANGEST_SELO_PRIVADA: ${{ secrets.KANGEST_SELO_PRIVADA }}
        run: npm run tauri build -- ${{ matrix.args }}

      # Diz ao «publicar» se este instalador leva a chave do produtor da AGT (o painel avisa quando não leva).
      - name: Certificação AGT
        id: agt
        shell: bash
        env:
          KANGEST_AGT_CHAVE: ${{ secrets.KANGEST_AGT_CHAVE }}
        run: |
          if [ -n "$KANGEST_AGT_CHAVE" ]; then echo "agt=sim" >> "$GITHUB_OUTPUT"; else echo "agt=nao" >> "$GITHUB_OUTPUT"; fi

      - name: Confirmar a assinatura (Mac)
        if: runner.os == 'macOS'
        run: |
          # a pasta de trabalho é app/kangest-sistema (defaults.run)
          for app in src-tauri/target/${{ matrix.alvo }}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kangest-livraria-${{ matrix.nome }}
          path: ${{ matrix.ficheiros }}
          if-no-files-found: error

  # O instalador no site: https://livrariaadventista.ao/kangest/actualizacoes/ (docs/KANGEST.md, «Descarregar e
  # actualizar»). À parte do instalador, como o APK do android.yml: só este escreve no repositório, e só vê o segredo
  # da assinatura das actualizações. Os ficheiros de uma Release deste repositório privado não se descarregam sem
  # sessão no GitHub; servidos pelo site, sim.
  publicar:
    name: Publicar no site
    if: github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/main'
    needs: instalador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Para lançar o deploy do site, que passa a servir o instalador novo.
      actions: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # os três: o do Windows e os dois do Mac
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kangest-livraria-*
          path: ${{ runner.temp }}/instalador
          merge-multiple: true

      - name: Assinar, escrever o manifesto e guardar numa Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KANGEST_LIVRARIA_ACTUALIZACOES_PRIVADA }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KANGEST_LIVRARIA_ACTUALIZACOES_SENHA }}
          CHAVE_PUBLICA: ${{ vars.KANGEST_LIVRARIA_CHAVE_ACTUALIZACOES }}
          AGT: ${{ needs.instalador.outputs.agt }}
        run: |
          set -euo pipefail
          # Sem a pública embutida, o programa instalado aceitaria actualizações só com o SHA-256; sem a privada,
          # o manifesto sairia sem assinaturas e os programas com a pública recusavam-nas.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$CHAVE_PUBLICA" ]; then
            echo "::error::Falta a chave das actualizações: os segredos KANGEST_LIVRARIA_ACTUALIZACOES_PRIVADA e KANGEST_LIVRARIA_ACTUALIZACOES_SENHA e a variável KANGEST_LIVRARIA_CHAVE_ACTUALIZACOES (docs/KANGEST.md)."
            exit 1
          fi
          versao="$(node -p "require('./app/kangest-sistema/src-tauri/tauri.conf.json').version")"
          cli="$(node -p "require('./app/kangest-sistema/package-lock.json').packages['node_modules/@tauri-apps/cli'].version")"
          P="$RUNNER_TEMP/publicar"
          mkdir -p "$P"
          # Sem espaços no nome: vai tal e qual no manifesto e no endereço. O do Windows tem de estar; os do Mac também
          # (um Mac sem o instalador dele ficava na versão de antes sem ninguém saber).
          exe="KanGest-Livraria_${versao}_x64-setup.exe"
          mac_as="KanGest-Livraria_${versao}_aarch64.dmg"
          mac_intel="KanGest-Livraria_${versao}_x64.dmg"
          cp "$(ls "$RUNNER_TEMP"/instalador/*_x64-setup.exe | head -1)" "$P/$exe"
          cp "$(ls "$RUNNER_TEMP"/instalador/*_aarch64.dmg | head -1)" "$P/$mac_as"
          cp "$(ls "$RUNNER_TEMP"/instalador/*_x64.dmg | head -1)" "$P/$mac_intel"
          printf '%s' "$CHAVE_PUBLICA" > "$RUNNER_TEMP/chave.pub"
          for f in "$exe" "$mac_as" "$mac_intel"; do
            t=$(stat -c %s "$P/$f")
            # O Cloudflare Pages não serve ficheiros com mais de 25 MiB.
            if [ "$t" -gt 26214400 ]; then
              echo "::error::$f tem $t bytes e o site só serve ficheiros até 25 MiB."
              exit 1
            fi
            npx --yes "@tauri-apps/cli@$cli" signer sign "$P/$f"
            # A assinatura tem de conferir com a chave que vai dentro do programa; senão, ninguém actualizava.
            node scripts/kangest/verificar-assinatura.mjs "$RUNNER_TEMP/chave.pub" "$P/$f.sig" "$P/$f"
          done
          # as notas da versão (o primeiro parágrafo) aparecem no programa ao oferecer a actualização
          python3 app/kangest-sistema/scripts/manifesto-atualizacao.py "$P" "$versao" "app/kangest-sistema/docs/versoes/v${versao}.md"
          agt=false
          [ "$AGT" = sim ] && agt=true
          jq --argjson agt "$agt" \
            --argjson w "$(stat -c %s "$P/$exe")" --argjson a "$(stat -c %s "$P/$mac_as")" --argjson i "$(stat -c %s "$P/$mac_intel")" \
            '.certificado_agt = $agt | .pacotes["windows-x86_64"].tamanho = $w | .pacotes["macos-aarch64"].tamanho = $a | .pacotes["macos-x86_64"].tamanho = $i' \
            "$P/kangest-atualizacao.json" > "$P/manifesto.json"
          mv "$P/manifesto.json" "$P/kangest-atualizacao.json"
          cat "$P/kangest-atualizacao.json"
          tag="kangest-livraria-v${versao}-b${GITHUB_RUN_NUMBER}"
          if [ "$agt" = true ]; then
            ensaio=""
            notas="O KanGest Livraria ${versao} para Windows e Mac, com a certificação da AGT. Descarrega-se no painel do site (Sistema → Ligação ao KanGest)."
          else
            # Uma versão de ensaio nunca passa à frente de uma certificada no site (deploy-cloudflare.yml).
            ensaio="--prerelease"
            notas="Versão de ENSAIO do KanGest Livraria ${versao}: sem a chave do produtor da AGT, as facturas saem com a chave de desenvolvimento e não valem para vender ao público."
          fi
          gh release create "$tag" "$P/$exe" "$P/$exe.sig" "$P/$mac_as" "$P/$mac_as.sig" "$P/$mac_intel" "$P/$mac_intel.sig" \
            "$P/kangest-atualizacao.json" "$P/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --latest=false $ensaio \
            --title "KanGest Livraria ${versao} (build ${GITHUB_RUN_NUMBER})" --notes "$notas"
          {
            echo "Instalador publicado em **${tag}** ($([ "$agt" = true ] && echo 'certificado pela AGT' || echo 'ensaio, sem a AGT'))."
            echo ""
            echo "O site é publicado outra vez e passa a servi-los em https://livrariaadventista.ao/kangest/actualizacoes/: ${exe}, ${mac_as} e ${mac_intel}"
            echo "(no painel: Sistema → Ligação ao KanGest → Descarregar)."
          } >> "$GITHUB_STEP_SUMMARY"

      # O deploy do site copia o instalador e o manifesto desta Release para /kangest/actualizacoes/.
      - name: Publicar o site com o instalador novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main
