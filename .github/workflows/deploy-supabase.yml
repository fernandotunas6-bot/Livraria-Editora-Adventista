name: Deploy — Supabase (migrações e Edge Functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

# Duas publicações ao mesmo tempo aplicavam as mesmas migrações em paralelo; a segunda espera.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  # O ensaio (KANGEST ONE, fase F; docs/AMBIENTES.md): as migrações e a Edge Function vão primeiro para o projecto de
  # staging. Se falharem lá, a produção não é tocada. Sem o staging configurado (o ambiente «staging» do GitHub, com
  # STAGING_SUPABASE_URL e STAGING_DB_PASSWORD), passa à frente com um aviso e a produção segue como até aqui.
  staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_URL: ${{ vars.STAGING_SUPABASE_URL }}
      PROJECT_REF_PRODUCAO: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: O staging está configurado?
        id: cfg
        run: |
          ref=$(printf '%s' "$STAGING_URL" | sed -nE 's#^https://([a-z0-9]{20})\.supabase\.co/?$#\1#p')
          if [ -z "$STAGING_URL" ]; then
            echo "::notice::Sem staging (falta STAGING_SUPABASE_URL no ambiente «staging» do GitHub): a produção segue sem ensaio. Ver docs/AMBIENTES.md."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ref" ]; then
            echo "::error::STAGING_SUPABASE_URL tem de ser https://<ref de 20 letras>.supabase.co"
            exit 1
          fi
          if [ "$ref" = "$PROJECT_REF_PRODUCAO" ]; then
            echo "::error::O staging aponta para o projecto de produção: corrija STAGING_SUPABASE_URL."
            exit 1
          fi
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam no ambiente «staging»:${missing/SUPABASE_DB_PASSWORD/STAGING_DB_PASSWORD}"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.ref != ''
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1 (v1.7.3)
        if: steps.cfg.outputs.ref != ''
        with:
          version: 2.121.0

      - name: Ligar ao staging
        if: steps.cfg.outputs.ref != ''
        run: |
          supabase link --project-ref "${{ steps.cfg.outputs.ref }}" || {
            echo "::error::O staging não responde (pausado por inactividade?). Restaure-o no painel do Supabase, ou apague STAGING_SUPABASE_URL do ambiente «staging» para publicar sem ensaio."
            exit 1
          }

      - name: Aplicar as migrações no staging
        if: steps.cfg.outputs.ref != ''
        run: supabase db push --include-all

      - name: Publicar a Edge Function "app" no staging
        if: steps.cfg.outputs.ref != ''
        run: supabase functions deploy app --project-ref "${{ steps.cfg.outputs.ref }}" --no-verify-jwt

  deploy:
    # só depois do ensaio no staging (ou sem staging configurado)
    needs: staging
    runs-on: ubuntu-latest
    # O token do GitHub só precisa de ler o código: as credenciais de produção vêm dos segredos.
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Confirmar segredos e variáveis
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD BACKUP_PASSPHRASE PROJECT_REF; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam em Settings → Secrets and variables → Actions:${missing/PROJECT_REF/SUPABASE_PROJECT_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1 (v1.7.3)
        with:
          version: 2.121.0

      - name: Ligar ao projecto
        run: supabase link --project-ref "$PROJECT_REF"

      # Dois PRs verdes podem trazer a mesma versão com nomes diferentes (não dá conflito no git), e
      # o `db push` só falharia a meio. Aqui pára antes de tocar em produção.
      - name: Confirmar que as versões das migrações não se repetem
        run: |
          repetidas=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -c1-14 | sort | uniq -d)
          if [ -n "$repetidas" ]; then
            echo "::error::Versões de migração repetidas: $repetidas"
            exit 1
          fi

      # O plano Free não tem recuperação pontual (PITR) e o backup semanal pode ter até 7 dias: antes
      # de aplicar migrações — algumas mexem nos dados (encomendas, vendas) — tira-se um backup
      # completo, cifrado como o semanal (backup-base-dados.yml; restauro em docs/BACKUPS.md). Só
      # quando há alguma por aplicar. Se o backup falhar, produção não é tocada.
      - name: Há migrações por aplicar?
        id: pendentes
        run: |
          set -o pipefail
          saida=$(supabase db push --include-all --dry-run 2>&1) || { echo "$saida"; exit 1; }
          echo "$saida"
          if echo "$saida" | grep -qi "up to date"; then
            echo "aplicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "aplicar=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup antes das migrações (cifrado)
        if: steps.pendentes.outputs.aplicar == 'sim'
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%MZ)"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          mkdir -p "backup-$stamp"
          supabase db dump --linked -f "backup-$stamp/roles.sql" --role-only
          supabase db dump --linked -f "backup-$stamp/schema.sql"
          supabase db dump --linked -f "backup-$stamp/data.sql" --use-copy --data-only
          for f in roles schema data; do
            size=$(stat -c %s "backup-$stamp/$f.sql")
            echo "$f.sql: $size bytes"
            [ "$size" -gt 100 ] || { echo "::error::$f.sql veio vazio: não se aplicam migrações sem backup"; exit 1; }
          done
          ( cd "backup-$stamp" && sha256sum *.sql > SHA256SUMS )
          tar -czf "backup-$stamp.tar.gz" "backup-$stamp"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 -o "backup-$stamp.tar.gz.gpg" "backup-$stamp.tar.gz" <<< "$BACKUP_PASSPHRASE"
          sha256sum "backup-$stamp.tar.gz.gpg" > "backup-$stamp.tar.gz.gpg.sha256"
          rm -rf "backup-$stamp" "backup-$stamp.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pendentes.outputs.aplicar == 'sim'
        with:
          name: backup-antes-do-deploy-${{ env.STAMP }}
          path: |
            backup-*.tar.gz.gpg
            backup-*.tar.gz.gpg.sha256
          retention-days: 30
          if-no-files-found: error

      # `--include-all`: há PRs em paralelo com migrações do mesmo dia. Sem isto, quando um PR
      # com migrações mais antigas entra depois de outro com mais recentes, o `db push` recusa-as
      # ("inserted before the last migration on remote") e a publicação pára aqui.
      - name: Aplicar migrações
        run: supabase db push --include-all

      - name: Publicar Edge Function "app"
        run: supabase functions deploy app --project-ref "$PROJECT_REF" --no-verify-jwt

      # Funções que já não existem no repositório e devem sair do projecto.
      # "migrar-dados" serviu só para a importação do PocketBase (concluída em 2026-11-01).
      - name: Apagar Edge Functions retiradas
        run: |
          for fn in migrar-dados; do
            if supabase functions list --project-ref "$PROJECT_REF" | grep -qw "$fn"; then
              supabase functions delete "$fn" --project-ref "$PROJECT_REF"
            else
              echo "$fn já não existe."
            fi
          done
