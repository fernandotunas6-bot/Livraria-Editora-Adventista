name: Deploy — Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Confirmar segredos e variáveis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam em Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Pós-build de SEO e partilha — o mesmo passo do scripts/deploy-site.sh: endereços
      # públicos do destino, livros e colecções no sitemap, e uma página de partilha por livro
      # (capa e título no WhatsApp). Sem ele, uma publicação pelo Actions saía com o endereço
      # do projecto antigo no canonical e sem as páginas dos livros.
      # As ligações do site abrem no app iOS (docs/APP_IOS.md). Sem a variável APPLE_TEAM_ID não
      # escreve nada e o deploy segue.
      - name: Ligação ao app iOS
        run: node scripts/apple-app-site-association.mjs dist/app/web
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: SEO e partilha do catálogo
        run: node scripts/seo-catalogo.mjs dist/app/web "$SITE_URL"
        env:
          # Não se deriva do nome do projecto: o endereço .pages.dev deste tem o sufixo -ben.
          SITE_URL: ${{ vars.SITE_URL || 'https://livrariaadventista.ao' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Cria o projecto no Cloudflare Pages na primeira vez; se já existir, não faz nada.
      # O wrangler tem a versão fixa, como as acções (fixadas por SHA): este passo corre com o token
      # da Cloudflare no ambiente, e `wrangler@3` descarregava a versão 3.x que estivesse no npm
      # nesse dia. Para actualizar, mudar aqui e no `wranglerVersion` do passo seguinte.
      - name: Garantir que o projecto Pages existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if npx --yes wrangler@3.114.17 pages project list 2>/dev/null | grep -qw -- "$PROJECT"; then
            echo "Projecto $PROJECT já existe."
          else
            npx --yes wrangler@3.114.17 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v3 (v3.15.0)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.17'
          command: pages deploy dist/app/web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
