<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0b1730}
  .scene{position:relative;width:1200px;height:520px;overflow:hidden;
    background:
      radial-gradient(ellipse 38% 52% at 50% 50%, rgba(255,214,140,.38) 0%, rgba(214,160,72,.10) 42%, rgba(8,15,32,0) 72%),
      radial-gradient(ellipse 60% 80% at 0% 100%, rgba(14,116,144,.35) 0%, rgba(14,116,144,0) 60%),
      radial-gradient(ellipse 60% 80% at 100% 0%, rgba(14,116,144,.28) 0%, rgba(14,116,144,0) 60%),
      linear-gradient(180deg, #141e33 0%, #0b1426 55%, #070d1c 100%);}
  .stage{position:absolute;left:600px;top:260px;width:0;height:0;}
  .ring{position:absolute;left:0;top:0;border-radius:50%;transform-style:preserve-3d}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;
    border:var(--w) solid transparent;
    background:conic-gradient(from 210deg,#7a5418,#f6dc9a,#fff3cf,#c99a3e,#6b4914,#d8b265,#7a5418) border-box;
    -webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0) border-box;
    mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0) border-box;
    filter:drop-shadow(0 0 10px rgba(255,210,130,.45))}
  .sun{position:absolute;left:-95px;top:-95px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #fffdf6 0%, #fff1cc 30%, #f3cf86 58%, #c9953f 82%, #8a5f20 100%);
    box-shadow:0 0 60px 18px rgba(255,220,150,.55), 0 0 160px 60px rgba(255,200,120,.25), inset -18px -22px 40px rgba(120,70,10,.45)}
  .halo{position:absolute;left:-260px;top:-260px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,236,190,.35), rgba(255,214,140,0) 62%)}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 75% 85% at 50% 50%, transparent 55%, rgba(5,10,24,.7) 100%)}
</style></head>
<body>
<div class="scene">
  <div class="stage" id="stage">
    <div class="halo"></div>
  </div>
  <div class="vignette"></div>
</div>
<script>
  const stage=document.getElementById('stage');
  const rings=[
    {d:440,w:3,t:'rotateX(74deg) rotateY(-8deg)'},
    {d:340,w:5,t:'rotateX(68deg) rotateY(22deg) rotateZ(10deg)'},
    {d:260,w:2,t:'rotateX(-58deg) rotateY(36deg)'},
    {d:560,w:1.5,t:'rotateX(80deg) rotateY(6deg)'},
  ];
  // anéis atrás e à frente da esfera: metade de trás desenhada antes, frente depois
  // cada anel em duas metades: a de trás antes da esfera, a da frente depois (oclusão real)
  const mk=(r,half)=>{const e=document.createElement('div');e.className='ring';
    const backTop=!r.t.startsWith('rotateX(-');
    const clip=(half==='back')===backTop?'inset(0 0 50% 0)':'inset(50% 0 0 0)';
    e.style.cssText=`width:${r.d}px;height:${r.d}px;left:${-r.d/2}px;top:${-r.d/2}px;--w:${r.w}px;transform:perspective(1100px) ${r.t};clip-path:${clip}`;
    if(half==='back') e.style.opacity=.75; stage.appendChild(e);};
  for(const r of rings) mk(r,'back');
  const sun=document.createElement('div');sun.className='sun';stage.appendChild(sun);
  for(const r of rings) mk(r,'front');
</script>
</body></html>
