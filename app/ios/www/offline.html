<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sem ligação</title>
<!--
  Ecrã do próprio app quando o site não abre (sem rede, ou o servidor não responde).
  O Capacitor mostra-o no lugar do site (`server.errorPath` em capacitor.config.json).
  Tudo aqui dentro: não pode depender da internet.
-->
<style>
  :root {
    --fundo: #ffffff;
    --texto: #0f172a;
    --suave: #475569;
    --marca: #0c4a6e;
    --marca-texto: #ffffff;
    --borda: #e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0b1220;
      --texto: #f1f5f9;
      --suave: #94a3b8;
      --marca: #38bdf8;
      --marca-texto: #0b1220;
      --borda: #1e293b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
  }
  main { max-width: 340px; width: 100%; }
  img {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    border: 1px solid var(--borda);
    display: block;
    margin: 0 auto 28px;
  }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; font-weight: 650; }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 28px; color: var(--suave); }
  button {
    appearance: none;
    border: 0;
    border-radius: 12px;
    background: var(--marca);
    color: var(--marca-texto);
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    width: 100%;
    min-height: 50px;
    cursor: pointer;
  }
  button:active { opacity: .8; }
  button[disabled] { opacity: .6; }
  small { display: block; margin-top: 16px; font-size: 13px; color: var(--suave); min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="">
  <h1>Sem ligação à internet</h1>
  <p>A Livraria Adventista precisa de internet para abrir. Verifique os dados móveis ou o Wi‑Fi e tente outra vez.</p>
  <button id="tentar" type="button">Tentar outra vez</button>
  <small id="estado" role="status" aria-live="polite"></small>
</main>
<script>
  // O endereço do site é o `server.url` do capacitor.config.json.
  var SITE = 'https://livrariaadventista.ao/';
  var botao = document.getElementById('tentar');
  var estado = document.getElementById('estado');

  function voltar() {
    botao.disabled = true;
    estado.textContent = 'A abrir…';
    window.location.replace(SITE);
    // Se continuar sem rede, o app volta a mostrar este ecrã; o botão fica outra vez activo.
    setTimeout(function () { botao.disabled = false; estado.textContent = ''; }, 8000);
  }

  botao.addEventListener('click', voltar);
  // A rede voltou: abre sozinho.
  window.addEventListener('online', voltar);
</script>
</body>
</html>
