<!-- O retorno da entrada com o Google no KanGest (KANGEST ONE, fase A): o Auth do site devolve o código aqui, e esta
     página passa-o ao KanGest pela ligação kangest://auth. Não guarda nada e não fala com o site: o código só serve ao
     KanGest que começou a entrada (PKCE). O script está à parte (entrar.mjs) por causa da política de segurança. -->
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>A voltar ao KanGest</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { color-scheme: light dark; --fundo: #f4f6f8; --cartao: #fff; --tinta: #15202b; --tinta2: #4a5866; --marca: #0b6f88; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #11161c; --cartao: #182029; --tinta: #e8edf2; --tinta2: #a9b5c1; --marca: #4cc0dc; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--fundo); color: var(--tinta);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--cartao); border-radius: 14px; padding: 28px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; }
    p { margin: 0 0 14px; color: var(--tinta2); }
    a.botao { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 6px;
      background: var(--marca); color: #fff; font-weight: 600; text-decoration: none; }
    a.botao[hidden] { display: none; }
    small { display: block; margin-top: 16px; color: var(--tinta2); font-size: 13px; }
  </style>
</head>
<body>
  <main id="kangest-entrar">
    <h1>A voltar ao KanGest…</h1>
    <p id="texto">O navegador vai pedir para abrir o KanGest. Se não abrir, carregue no botão.</p>
    <a id="abrir" class="botao" href="kangest://">Abrir o KanGest</a>
    <small>Depois de o KanGest abrir, pode fechar esta página.</small>
  </main>
  <script type="module" src="/kangest/entrar/entrar.mjs"></script>
</body>
</html>
