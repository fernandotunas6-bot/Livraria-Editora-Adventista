<!doctype html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0c4a6e" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Livraria Adventista" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<!-- Fontes: pedidas aqui, e não com @import dentro do CSS. Com o @import o browser só as
		     descobria depois de descarregar e ler o CSS da loja, e fazia mais dois pedidos em série
		     (0,2–0,4 s cada a partir de Angola). O preconnect abre já as ligações. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" />
		<meta name="description" content="Livraria Adventista — literatura cristã, educação e inspiração. Compre online com entrega ao domicílio." />
		<title>Livraria Adventista</title>
		<link rel="canonical" href="https://livrariaadventista.ao/" />

		<!-- Partilha no WhatsApp, Facebook e X. As páginas de livro e de colecção reescrevem
		     estas etiquetas com o react-helmet; isto é o que vale para a raiz e para quem
		     partilha um link antes de o JavaScript correr. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Livraria Adventista" />
		<meta property="og:locale" content="pt_AO" />
		<meta property="og:title" content="Livraria Adventista" />
		<meta property="og:description" content="Literatura cristã, educação e inspiração. Compre online com entrega em todo o país." />
		<meta property="og:url" content="https://livrariaadventista.ao/" />
		<meta property="og:image" content="https://livrariaadventista.ao/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Livraria &amp; Editora Adventista S.A" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Livraria Adventista" />
		<meta name="twitter:description" content="Literatura cristã, educação e inspiração. Compre online com entrega em todo o país." />
		<meta name="twitter:image" content="https://livrariaadventista.ao/og-image.png" />

		<!-- Quem é a loja, para os motores de busca (schema.org: o nome do site e o logótipo nos
		     resultados). É um bloco de dados e não um script: o navegador não o executa, e o CSP
		     (`script-src` sem 'unsafe-inline') não o bloqueia. A ficha de cada livro acrescenta o
		     seu (lib/structuredData.js). Numa pré-visualização o pós-build troca os endereços. -->
		<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://livrariaadventista.ao/#organizacao","name":"Livraria Adventista","url":"https://livrariaadventista.ao/","logo":"https://livrariaadventista.ao/icons/icon-512.png"},{"@type":"WebSite","@id":"https://livrariaadventista.ao/#site","name":"Livraria Adventista","url":"https://livrariaadventista.ao/","inLanguage":"pt-AO","publisher":{"@id":"https://livrariaadventista.ao/#organizacao"}}]}</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
		<script src="/sw-register.js" defer></script>
	</body>
</html>
